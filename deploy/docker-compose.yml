version: '3.8'
services:
  sakec-tbi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sakec_tbi_platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SAKEC_DB_PATH=/app/data/sakec_tbi.db
    volumes:
      - sakec_tbi_data:/app/data

volumes:
  sakec_tbi_data:
    driver: local
